<script>
function filterCards() {
    const query = document.getElementById("cardSearch").value.toLowerCase();
    const cards = document.querySelectorAll(".card-item");
    const setBlocks = document.querySelectorAll(".set-block");
    const setRows = document.querySelectorAll(".set-row");

    const searching = query.length > 0;

    cards.forEach(card => {
        const name = card.dataset.cardName;
        card.style.display = name.includes(query) ? "" : "none";
    });

    setRows.forEach((row, index) => {
        const cardsInRow = row.querySelectorAll(".card-item");
        const visible = Array.from(cardsInRow).some(c => c.style.display !== "none");

        // Hide or show rows normally
        row.style.display = visible ? "" : "none";

        // Hide ALL titles when searching
        if (searching) {
            setBlocks[index].style.display = "none";
        } 
        else {
            setBlocks[index].style.display = visible ? "" : "none";
        }
    });
}
</script>
