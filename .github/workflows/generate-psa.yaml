name: Generate PSA and Update Website

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # Runs every night at midnight Eastern Time

concurrency:
  group: "generate-psa-and-update-website"
  cancel-in-progress: true  # optional: cancels any running workflow in the same group

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    strategy:
      matrix:
        set:
          - "Rebel Clash"
          - "Darkness Ablaze"
          - "Champion's Path"
          - "Vivid Voltage"
          - "Shining Fates"
          - "Battle Styles"
          - "Chilling Reign"
          - "Fusion Strike"
          - "Astral Radiance"
          - "Lost Origin"
          - "Silver Tempest"
          - "Paradox Rift"
          - "Paldean Fates"
          - "Twilight Masquerade"
          - "Obsidian Flames"
          - "151"
          - "Paldea Evolved"
          - "Evolving Skies"
          - "Crown Zenith"
          - "Surging Sparks"
          - "Prismatic Evolutions"
          - "Journey Together"
          - "Destined Rivals"
          - "Black Bolt"
          - "White Flare"
          - "Mega Evolution"
          - "Phantasmal Flames"
      max-parallel: 10   # <--- run only one matrix job at a time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Python script with retry
        run: |
          max_attempts=25
          delay=10
          attempt=1
      
          until python scripts/generate_psa_json.py "${{ matrix.set }}"; do
            echo "Attempt $attempt failed. Retrying in $delay seconds..."
            if [ $attempt -ge $max_attempts ]; then
              echo "All $max_attempts attempts failed. Exiting."
              exit 1
            fi
            attempt=$(( attempt + 1 ))
            sleep $delay
          done
      
          echo "Script completed successfully on attempt $attempt."
      
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      
          git checkout main
      
          # Reset any unstaged/untracked changes to avoid pull errors
          git reset --hard
          git clean -fd
      
          # Pull latest from origin
          git pull origin main --rebase || true
      
          # Stage changes
          git add .
      
          # Commit only if there are changes
          if ! git diff --cached --quiet; then
              git commit -m "Update PSA JSON for ${{ matrix.set }}"
              git push origin main
          else
              echo "No changes to commit"
          fi

  trigger_followups:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger Combine PSA workflow
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "combine-psa.yaml",
              ref: "main"
            })

      - name: Wait 1 Minute
        run: |
          sleep 60

      - name: Trigger Update Website workflow
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "update-website.yaml",
              ref: "main"
            })
