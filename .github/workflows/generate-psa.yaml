name: Generate PSA and Update Website

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # Runs nightly at midnight Eastern Time (05:00 UTC)

concurrency:
  group: "generate-psa-and-update-website"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        set:
          - "Rebel Clash"
          - "Darkness Ablaze"
          - "Champion's Path"
          - "Vivid Voltage"
          - "Shining Fates"
          - "Battle Styles"
          - "Chilling Reign"
          - "Fusion Strike"
          - "Astral Radiance"
          - "Lost Origin"
          - "Silver Tempest"
          - "Paradox Rift"
          - "Paldean Fates"
          - "Twilight Masquerade"
          - "Obsidian Flames"
          - "151"
          - "Paldea Evolved"
          - "Evolving Skies"
          - "Crown Zenith"
          - "Surging Sparks"
          - "Prismatic Evolutions"
          - "Journey Together"
          - "Destined Rivals"
          - "Black Bolt"
          - "White Flare"
          - "Mega Evolution"
          - "Phantasmal Flames"
          - "Sun & Moon"
          - "Guardians Rising"
          - "Burning Shadows"
          - "Shining Legends"
          - "Crimson Invasion"
          - "Ultra Prism"
          - "Forbidden Light"
          - "Celestial Storm"
          - "Dragon Majesty"
          - "Lost Thunder"
          - "Team Up"
          - "Unbroken Bonds"
          - "Unified Minds"
          - "Hidden Fates"
          - "Cosmic Eclipse"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python script with retry
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          max_attempts=60
          delay=15
          attempt=1

          until python scripts/generate_psa_json.py "${{ matrix.set }}"; do
            echo "Attempt $attempt failed. Retrying in $delay seconds..."
            if [ $attempt -ge $max_attempts ]; then
              echo "All $max_attempts attempts failed. Exiting."
              exit 1
            fi
            attempt=$(( attempt + 1 ))
            sleep $delay
          done

          echo "Script completed successfully on attempt $attempt."

      - name: Commit and push changes
        env:
          PAT_TOKEN: ${{ secrets.POKEMON_PAT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          max_push_attempts=10
          push_attempt=1

          while [ $push_attempt -le $max_push_attempts ]; do
            git fetch origin main
            git reset --soft origin/main
            git add .

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Update PSA JSON for ${{ matrix.set }}"

            if git push https://${PAT_TOKEN}@github.com/${{ github.repository }} HEAD:main; then
              echo "Push succeeded on attempt $push_attempt"
              exit 0
            fi

            echo "Push failed (attempt $push_attempt/$max_push_attempts). Retrying..."
            push_attempt=$((push_attempt + 1))
            sleep $((RANDOM % 10 + 5))
          done

          echo "All push attempts failed."
          exit 1

  trigger_combine:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger Combine PSA workflow
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.POKEMON_PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "combine-psa.yaml",
              ref: "main"
            })
