name: Generate PSA and Update Website

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # Runs nightly at midnight Eastern Time (05:00 UTC)

concurrency:
  group: "generate-psa-and-update-website"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - set: "Sword & Shield"
            index: 0
          - set: "Rebel Clash"
            index: 1
          - set: "Darkness Ablaze"
            index: 2
          - set: "Champion's Path"
            index: 3
          - set: "Vivid Voltage"
            index: 4
          - set: "Shining Fates"
            index: 5
          - set: "Battle Styles"
            index: 6
          - set: "Chilling Reign"
            index: 7
          - set: "Evolving Skies"
            index: 8
          - set: "Brilliant Stars"
            index: 9
          - set: "Astral Radiance"
            index: 10
          - set: "Lost Origin"
            index: 11
          - set: "Silver Tempest"
            index: 12
          - set: "Crown Zenith"
            index: 13
          - set: "Scarlet & Violet"
            index: 14
          - set: "Paldea Evolved"
            index: 15
          - set: "Obsidian Flames"
            index: 16
          - set: "151"
            index: 17
          - set: "Paradox Rift"
            index: 18
          - set: "Paldean Fates"
            index: 19
          - set: "Temporal Forces"
            index: 20
          - set: "Twilight Masquerade"
            index: 21
          - set: "Shrouded Fable"
            index: 22
          - set: "Stellar Crown"
            index: 23
          - set: "Surging Sparks"
            index: 24
          - set: "Prismatic Evolutions"
            index: 25
          - set: "Journey Together"
            index: 26
          - set: "Destined Rivals"
            index: 27
          - set: "Black Bolt"
            index: 28
          - set: "White Flare"
            index: 29
          - set: "Mega Evolution"
            index: 30
          - set: "Phantasmal Flames"
            index: 31
          - set: "Ascended Heroes"
            index: 32

    steps:
      - name: Stagger job start
        run: |
          delay=$((10 * ${{ matrix.index }}))
          echo "Waiting ${delay}s before starting (index ${{ matrix.index }})"
          sleep $delay

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python script with retry
        run: |
          max_attempts=60
          delay=15
          attempt=1

          until python scripts/generate_psa_json.py "${{ matrix.set }}"; do
            echo "Attempt $attempt failed. Retrying in $delay seconds..."
            if [ $attempt -ge $max_attempts ]; then
              echo "All $max_attempts attempts failed. Exiting."
              exit 1
            fi
            attempt=$(( attempt + 1 ))
            sleep $delay
          done

          echo "Script completed successfully on attempt $attempt."

      - name: Commit and push changes
        env:
          PAT_TOKEN: ${{ secrets.POKEMON_PAT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          max_push_attempts=10
          push_attempt=1

          while [ $push_attempt -le $max_push_attempts ]; do
            git fetch origin main
            git reset --soft origin/main
            git add .

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Update PSA JSON for ${{ matrix.set }}"

            if git push https://${PAT_TOKEN}@github.com/${{ github.repository }} HEAD:main; then
              echo "Push succeeded on attempt $push_attempt"
              exit 0
            fi

            echo "Push failed (attempt $push_attempt/$max_push_attempts). Retrying..."
            push_attempt=$((push_attempt + 1))
            sleep $((RANDOM % 10 + 5))
          done

          echo "All push attempts failed."
          exit 1

  trigger_combine:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger Combine PSA workflow
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.POKEMON_PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "combine-psa.yaml",
              ref: "main"
            })
